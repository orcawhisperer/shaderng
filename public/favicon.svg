<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <style>
    .bg { fill: #09090b; }
    .fg { fill: none; stroke: #fafafa; }
    .dot { fill: #fafafa; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #fafafa; }
      .fg { stroke: #09090b; }
      .dot { fill: #09090b; }
    }
  </style>
  <rect class="bg" width="512" height="512" rx="128" />
  <circle class="fg" cx="256" cy="256" r="132" stroke-width="24" />
  <ellipse class="fg" cx="256" cy="256" rx="74" ry="132" stroke-width="18" />
  <circle class="dot" cx="211" cy="202" r="28" />
</svg>
