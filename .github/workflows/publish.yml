name: Publish shaderng to npm

# Publishes the `ng add` package (schematics/) built into dist/schematics.
# Trigger by pushing a tag that matches schematics/package.json, e.g. `git tag v0.1.0 && git push --tags`,
# or run it by hand with a dry run first. Authentication uses npm trusted publishing (OIDC), which
# needs this workflow registered once on npmjs.com under the package's "Trusted publisher" settings;
# alternatively set an NPM_TOKEN repository secret and it is used instead.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and pack without publishing
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22.22.3"
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Check the tag matches the package version
        if: github.ref_type == 'tag'
        run: |
          version="$(node -p "require('./schematics/package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match schematics/package.json version ${version}" >&2
            exit 1
          fi
      - name: Test the schematics
        run: npm run test:schematics
      - name: Pack
        run: npm run pack:schematics
      - name: Publish
        if: github.ref_type == 'tag' || inputs.dry-run == false
        run: npm publish ./dist/schematics --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Dry run
        if: github.ref_type != 'tag' && inputs.dry-run != false
        run: npm publish ./dist/schematics --access public --dry-run
