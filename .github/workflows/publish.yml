name: Publish shaderng to npm

# Publishes the `ng add` package (schematics/) built into dist/schematics.
# Trigger by pushing a tag that matches schematics/package.json, e.g. `git tag v0.1.0 && git push --tags`,
# or run it by hand: "Run workflow" on main with "dry-run" unticked publishes the version on main.
# Authentication uses npm trusted publishing (OIDC): this workflow file (publish.yml) is registered on
# npmjs.com under the package's "Trusted publisher" settings, the job requests an id-token, and npm
# exchanges it for a short-lived publish credential. No npm token is stored anywhere. Trusted
# publishing needs npm 11.5.1 or later, which Node 22 does not bundle, so npm is upgraded first.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and pack without publishing
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22.22.3"
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Upgrade npm for trusted publishing (needs 11.5.1+)
        run: |
          npm install -g npm@latest
          npm --version
      - name: Check the tag matches the package version
        if: github.ref_type == 'tag'
        run: |
          version="$(node -p "require('./schematics/package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match schematics/package.json version ${version}" >&2
            exit 1
          fi
      - name: Test the schematics
        run: npm run test:schematics
      - name: Pack
        run: npm run pack:schematics
      - name: Publish
        if: github.ref_type == 'tag' || inputs.dry-run == false
        run: npm publish ./dist/schematics --access public --provenance
      - name: Dry run
        if: github.ref_type != 'tag' && inputs.dry-run != false
        run: npm publish ./dist/schematics --access public --dry-run
