name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22.22.3"
          cache: npm
      - uses: actions/configure-pages@v6
      - run: npm ci
      - name: Resolve base href
        id: base
        run: |
          NAME="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY%/*}"
          if [ "$NAME" = "${OWNER}.github.io" ]; then
            echo "href=/" >> "$GITHUB_OUTPUT"
          else
            echo "href=/${NAME}/" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        env:
          BASE_HREF: ${{ steps.base.outputs.href }}
        run: npm run build:pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/shadercn-angular/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
